name: Sniper 1D Scanner

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch scanner from private repo
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          echo "Downloading scanner.py from private repo..."
          curl -sS -w "\nHTTP_STATUS: %{http_code}\n" \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o scanner.py \
            https://api.github.com/repos/themservices001/sniper-scanner-private/contents/scanner.py
          echo ""
          echo "=== File size check ==="
          ls -la scanner.py
          echo "=== First 5 lines ==="
          head -5 scanner.py || echo "(file is empty)"
          echo "=== Line count ==="
          wc -l scanner.py

      - name: Verify Python environment
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -c "print('python sanity check OK')"

      - name: Run 1D scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode=1d

      - name: Commit state
        run: |
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add state_1d.json last_run_1d.txt || true
          git diff --staged --quiet || git commit -m "1d state $(date -u +%Y-%m-%d)"
          git push || true
